<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Felolvasó próba</title>
<style>
  :root { --bg: #fff7ec; --ink: #2b2250; --soft: #6b6390; --card: #fff; --acc: #0e788c; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.45 system-ui, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 24px; margin: 4px 0 6px; }
  p.note { color: var(--soft); margin: 0 0 18px; }
  .card { background: var(--card); border-radius: 16px; padding: 14px 16px; margin: 0 0 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
  .card h2 { font-size: 18px; margin: 0 0 8px; }
  textarea { width: 100%; box-sizing: border-box; font: inherit; font-size: 16px; padding: 8px; border-radius: 10px; border: 1px solid #ddd; min-height: 64px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
  button { font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 10px 14px; background: var(--acc); color: #fff; cursor: pointer; }
  button.alt { background: #845ef7; }
  button:disabled { opacity: .5; }
  .st { margin-top: 8px; color: var(--soft); font-size: 14px; min-height: 1.2em; }
  #log { font: 13px/1.4 ui-monospace, monospace; color: var(--soft); white-space: pre-wrap; }
</style>
</head>
<body>
<main>
  <h1>🔊 Felolvasó próba</h1>
  <p class="note">A program saját, beépített felolvasója – nem a készülék hangjait használja. Az első lejátszásnál a hang letöltődik (nyelvenként kb. 60–90 MB), utána gyors. Írd át nyugodtan a szöveget!</p>

  <div class="card" data-lang="hu">
    <h2>🇭🇺 Magyar</h2>
    <textarea>Mennyi negyvenkettő meg tizenhárom? Melyik szó van helyesen leírva? Egyszer volt, hol nem volt, élt egyszer egy bátor kis róka, Rozi.</textarea>
    <div class="row">
      <button data-v="hu_HU-anna-medium">Anna (női)</button>
      <button data-v="hu_HU-berta-medium">Berta (női)</button>
      <button class="alt" data-v="hu_HU-imre-medium">Imre (férfi)</button>
    </div>
    <div class="st"></div>
  </div>

  <div class="card" data-lang="en">
    <h2>🇬🇧 English</h2>
    <textarea>What is forty-two plus thirteen? Which word is spelled correctly? Once upon a time there lived a brave little fox called Rosie.</textarea>
    <div class="row">
      <button data-v="en_GB-alba-medium">Alba (female)</button>
      <button data-v="en_GB-jenny_dioco-medium">Jenny (female)</button>
      <button data-v="en_GB-cori-medium">Cori (female)</button>
      <button data-v="en_US-amy-medium">Amy (US, female)</button>
    </div>
    <div class="st"></div>
  </div>

  <div class="card" data-lang="ro">
    <h2>🇷🇴 Română</h2>
    <textarea>Cât face patruzeci și doi plus treisprezece? Ce cuvânt este scris corect? A fost odată ca niciodată o vulpiță curajoasă pe nume Roza.</textarea>
    <div class="row">
      <button class="alt" data-v="ro_RO-mihai-medium">Mihai (bărbat)</button>
    </div>
    <div class="st"></div>
  </div>

  <div id="log"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.18.0/ort.wasm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@diffusionstudio/piper-wasm@1.0.0/build/piper_phonemize.js"></script>
<script>
(function () {
  'use strict';
  const PHON = 'https://cdn.jsdelivr.net/npm/@diffusionstudio/piper-wasm@1.0.0/build/';
  const VOICES = 'https://huggingface.co/rhasspy/piper-voices/resolve/main/';
  ort.env.wasm.wasmPaths = 'https://cdnjs.cloudflare.com/ajax/libs/onnxruntime-web/1.18.0/';
  ort.env.wasm.numThreads = 1;               // több szál csak „cross-origin isolated” oldalon menne
  const logEl = document.getElementById('log');
  const log = m => { logEl.textContent += m + '\n'; };

  // --- kiejtés (espeak-ng) ---
  let phonMod = null, phonCb = null;
  async function phonemizer() {
    if (phonMod) return phonMod;
    phonMod = await createPiperPhonemize({
      print: d => { if (phonCb) { const cb = phonCb; phonCb = null; cb(JSON.parse(d)); } },
      printErr: m => console.warn(m),
      locateFile: u => PHON + u
    });
    return phonMod;
  }
  async function phonemize(text, cfg) {
    const m = await phonemizer();
    return new Promise(res => {
      phonCb = res;
      m.callMain(['-l', cfg.espeak.voice, '--input', JSON.stringify([{ text }]), '--espeak_data', '/espeak-ng-data']);
    });
  }

  // --- hangmodellek (letöltés + gyorsítótár) ---
  const sessions = {};
  function voicePath(id) {
    const [loc, name, q] = id.split('-');
    return VOICES + loc.split('_')[0] + '/' + loc + '/' + name + '/' + q + '/' + id;
  }
  async function cachedFetch(url) {
    let c = null;
    try { c = await caches.open('okos-tts-proba'); const hit = await c.match(url); if (hit) return hit; } catch (e) { /* nincs cache */ }
    const r = await fetch(url);
    if (!r.ok) throw new Error('Letöltési hiba: ' + url);
    if (c) try { await c.put(url, r.clone()); } catch (e) { /* tele */ }
    return r;
  }
  async function loadVoice(id, st) {
    if (sessions[id]) return sessions[id];
    const base = voicePath(id);
    st.textContent = '⏳ Hang letöltése… (első alkalommal eltarthat egy ideig)';
    const cfg = await (await cachedFetch(base + '.onnx.json')).json();
    const buf = await (await cachedFetch(base + '.onnx')).arrayBuffer();
    st.textContent = '⏳ Hang betöltése…';
    const sess = await ort.InferenceSession.create(buf, { executionProviders: ['wasm'] });
    return (sessions[id] = { cfg, sess });
  }

  async function synth(text, id, st) {
    const { cfg, sess } = await loadVoice(id, st);
    st.textContent = '⏳ Felolvasás előkészítése…';
    const t0 = performance.now();
    const ph = await phonemize(text, cfg);
    const ids = ph.phoneme_ids;
    const feeds = {
      input: new ort.Tensor('int64', BigInt64Array.from(ids.map(BigInt)), [1, ids.length]),
      input_lengths: new ort.Tensor('int64', BigInt64Array.from([BigInt(ids.length)]), [1]),
      scales: new ort.Tensor('float32', Float32Array.from([cfg.inference.noise_scale, cfg.inference.length_scale, cfg.inference.noise_w]), [3])
    };
    const out = await sess.run(feeds);
    const pcm = out.output.data, rate = cfg.audio.sample_rate;
    const ms = Math.round(performance.now() - t0), dur = pcm.length / rate;
    log(`${id}: ${dur.toFixed(1)} mp hang, elkészítés ${ms} ms`);
    window.__last = { id, ms, dur };
    return { pcm, rate, ms };
  }

  let actx = null;
  function play(pcm, rate) {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const b = actx.createBuffer(1, pcm.length, rate);
    b.copyToChannel ? b.copyToChannel(pcm, 0) : b.getChannelData(0).set(pcm);
    const s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start();
  }

  document.querySelectorAll('.card').forEach(card => {
    const st = card.querySelector('.st'), ta = card.querySelector('textarea');
    card.querySelectorAll('button').forEach(btn => btn.addEventListener('click', async () => {
      // iOS: a hangot a koppintáskor kell „feloldani”
      actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume();
      card.querySelectorAll('button').forEach(b => b.disabled = true);
      try {
        const { pcm, rate, ms } = await synth(ta.value.trim(), btn.dataset.v, st);
        play(pcm, rate);
        st.textContent = `▶️ ${btn.textContent} – elkészült ${(ms / 1000).toFixed(1)} mp alatt`;
      } catch (e) { st.textContent = '❌ ' + e.message; log(String(e && e.stack || e)); }
      card.querySelectorAll('button').forEach(b => b.disabled = false);
    }));
  });
  window.__synth = synth;
})();
</script>
</body>
</html>
