<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Okos Kaland</title>
  <meta name="description" content="Játékos tanulás 7–8 éveseknek: matek, nyelvtan, mesék és versek – magyarul, románul és angolul.">
  <!-- Ikonok és telepíthető alkalmazás (PWA) -->
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="img/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png">
  <link rel="apple-touch-icon" href="img/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0e788c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Okos Kaland">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preload" as="image" href="img/logo-hu.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Háttér: felhők és lebegő díszek -->
  <div class="sky" aria-hidden="true">
    <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div><div class="cloud c4"></div>
    <span class="floaty f1">⭐</span><span class="floaty f2">🎈</span><span class="floaty f3">🌸</span>
    <span class="floaty f4">✨</span><span class="floaty f5">🦋</span><span class="floaty f6">🌈</span>
  </div>

  <main id="app"></main>

  <canvas id="confetti" aria-hidden="true"></canvas>
  <div id="toast" role="status" aria-live="polite"></div>
  <div id="layer"></div>

  <noscript>Az Okos Kaland működéséhez engedélyezd a JavaScriptet a böngészőben.</noscript>

  <!-- Alap modulok -->
  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/tts.js"></script>
  <script src="js/rewards.js"></script>
  <script src="js/pics.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/engine.js"></script>

  <!-- Játékok – új játékfájlt ide kell felvenni -->
  <script src="js/games/matek.js"></script>
  <script src="js/games/nyelvtan.js"></script>
  <script src="js/games/irodalom.js"></script>
  <script src="js/games/mesekeszito.js"></script>

  <!-- Alkalmazás (mindig utolsó) -->
  <script src="js/app.js"></script>
</body>
</html>
